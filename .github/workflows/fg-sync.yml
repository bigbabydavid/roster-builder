name: FanGraphs data sync
on:
  schedule:
    - cron: '17 9 * * *'   # once a day, ~5:17am Eastern
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fg-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FanGraphs payroll pages
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          TEAMS = {'angels':'angels','diamondbacks':'diamondbacks','orioles':'orioles','red-sox':'red-sox','cubs':'cubs','reds':'reds',
                   'guardians':'guardians','rockies':'rockies','tigers':'tigers','astros':'astros','royals':'royals','dodgers':'dodgers',
                   'nationals':'nationals','mets':'mets','athletics':'athletics','pirates':'pirates','padres':'padres','mariners':'mariners',
                   'giants':'giants','cardinals':'cardinals','rays':'rays','rangers':'rangers','blue-jays':'blue-jays','twins':'twins',
                   'phillies':'phillies','braves':'braves','white-sox':'white-sox','marlins':'marlins','brewers':'brewers','yankees':'yankees'}
          UA = 'Mozilla/5.0 (compatible; mlbrostertool-data-sync; once-daily)'
          os.makedirs('data/fg/raw', exist_ok=True)
          ok = bad = 0
          for slug in TEAMS:
              for season in (2026, 2027):
                  url = f'https://www.fangraphs.com/roster-resource/payroll/{slug}?season={season}'
                  try:
                      html = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA}), timeout=60).read().decode('utf8')
                      m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
                      q = json.loads(m.group(1))['props']['pageProps']['dehydratedState']['queries'][0]
                      if q['queryKey'][1].get('season') != season: raise ValueError('wrong season in page: %r' % q['queryKey'])
                      data = q['state']['data']
                      if not data.get('dataContract'): raise ValueError('no contracts')
                      with open(f'data/fg/raw/{slug}-{season}.json', 'w') as f:
                          json.dump({'teamid': q['queryKey'][1].get('teamid'), 'season': season, 'data': data}, f, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
                      ok += 1
                  except Exception as e:
                      bad += 1; print('FAILED', slug, season, repr(e)[:200])
                  time.sleep(2)
          print('fetched', ok, 'failed', bad)
          if ok < 50: raise SystemExit('too many failures - not committing')
          PY
      - name: Commit if changed
        run: |
          git config user.name "fg-sync-bot"
          git config user.email "fg-sync-bot@users.noreply.github.com"
          git add data/fg
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update FanGraphs payroll data" && git push; fi
